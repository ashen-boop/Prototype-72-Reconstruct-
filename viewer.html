<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viewer - The Artistic Unity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #faf8f5;
            overflow: hidden;
            height: 100vh;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .top-bar .brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .top-bar .brand span {
            background: linear-gradient(135deg, #ff6b00, #ff1493, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .top-bar .close {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 10px 26px;
            border: 1.5px solid #dc2626;
            border-radius: 30px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            font-weight: 600;
            background: rgba(220, 38, 38, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .top-bar .close:hover {
            border-color: #dc2626;
            color: #fff;
            background: rgba(220, 38, 38, 0.3);
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.15);
        }
        .top-bar .close:active {
            transform: scale(0.96);
        }

        .toggle-bar {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(30px);
            padding: 14px 24px;
            display: none;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-width: 420px;
            max-width: 92%;
        }
        .toggle-bar.show {
            display: flex;
        }
        .toggle-bar .left-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toggle-bar .version-icon {
            font-size: 1.4rem;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(5deg); }
        }
        .toggle-bar .version-title {
            font-size: 0.6rem;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .toggle-bar .style-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #0a0a0a;
            padding: 4px 14px;
            border-radius: 8px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(0, 0, 0, 0.04);
            position: relative;
        }
        .toggle-bar .style-name::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff6b00, #ff1493, #2563eb);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: -1;
        }
        .toggle-bar .style-name.active {
            color: #fff;
            background: transparent;
        }
        .toggle-bar .style-name.active::before {
            opacity: 1;
        }
        .toggle-bar .right-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .toggle-bar .version-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 6px 12px;
            border-radius: 10px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid transparent;
            user-select: none;
        }
        .toggle-bar .version-label:hover {
            color: rgba(0, 0, 0, 0.7);
            transform: translateY(-1px);
        }
        .toggle-bar .version-label.active {
            color: #ff6b00;
            background: rgba(255, 107, 0, 0.06);
            border-color: rgba(255, 107, 0, 0.1);
            transform: translateY(-1px);
        }

        .toggle-bar .switch {
            width: 56px;
            height: 30px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: none;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }
        .toggle-bar .switch.active {
            background: linear-gradient(135deg, #ff6b00, #ff1493, #2563eb);
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.15);
        }
        .toggle-bar .switch .dot {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            pointer-events: none;
        }
        .toggle-bar .switch.active .dot {
            left: 29px;
            background: white;
            box-shadow: 0 4px 20px rgba(255, 107, 0, 0.2);
        }

        .toggle-bar .badge {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.08), rgba(255, 20, 147, 0.04));
            color: #ff6b00;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: 1px solid rgba(255, 107, 0, 0.06);
        }

        /* ============================================
           IFRAME — now animates between two states:
           - with toggle: top = 140px (64 top-bar + 60 toggle + 16 gap)
           - without toggle: top = 64px (just top-bar)
           ============================================ */
        .iframe-wrap {
            position: fixed;
            top: 140px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100vh - 140px);
            background: #faf8f5;
            transition: top 0.35s cubic-bezier(0.23, 1, 0.32, 1),
                        height 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }
        body.no-toggle .iframe-wrap {
            top: 64px;
            height: calc(100vh - 64px);
        }
        .iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            -webkit-overflow-scrolling: touch;
            overflow: auto;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            background: #faf8f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.6s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(255, 107, 0, 0.1);
            border-top-color: #ff6b00;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ============================================
           RESPONSIVE — same collapse logic at each breakpoint
           ============================================ */
        @media (max-width: 768px) {
            .top-bar { height: 54px; padding: 10px 18px; }
            .top-bar .brand { font-size: 1rem; }
            .top-bar .close { 
                font-size: 0.8rem; 
                padding: 8px 18px;
                gap: 6px;
            }
            .toggle-bar { 
                top: 66px;
                padding: 10px 16px;
                height: 52px;
                min-width: auto;
                width: 94%;
                border-radius: 16px;
            }
            .toggle-bar .version-icon { font-size: 1.2rem; }
            .toggle-bar .version-title { font-size: 0.5rem; }
            .toggle-bar .style-name { font-size: 0.7rem; padding: 3px 10px; }
            .toggle-bar .version-label { font-size: 0.6rem; padding: 4px 8px; }
            .toggle-bar .switch { width: 48px; height: 26px; }
            .toggle-bar .switch .dot { width: 20px; height: 20px; top: 3px; left: 3px; }
            .toggle-bar .switch.active .dot { left: 25px; }
            .toggle-bar .badge { display: none; }

            .iframe-wrap {
                top: 120px;
                height: calc(100vh - 120px);
            }
            body.no-toggle .iframe-wrap {
                top: 54px;
                height: calc(100vh - 54px);
            }
        }

        @media (max-width: 480px) {
            .top-bar { height: 48px; padding: 8px 14px; }
            .top-bar .brand { font-size: 0.85rem; }
            .top-bar .close { 
                font-size: 0.7rem; 
                padding: 6px 14px;
                gap: 4px;
            }
            .toggle-bar { 
                top: 58px;
                padding: 8px 12px;
                height: 46px;
                width: 96%;
                border-radius: 14px;
            }
            .toggle-bar .version-icon { font-size: 1rem; }
            .toggle-bar .version-title { display: none; }
            .toggle-bar .style-name { font-size: 0.6rem; padding: 2px 8px; }
            .toggle-bar .version-label { font-size: 0.5rem; padding: 3px 6px; }
            .toggle-bar .switch { width: 40px; height: 22px; }
            .toggle-bar .switch .dot { width: 16px; height: 16px; top: 3px; left: 3px; }
            .toggle-bar .switch.active .dot { left: 21px; }

            .iframe-wrap {
                top: 104px;
                height: calc(100vh - 104px);
            }
            body.no-toggle .iframe-wrap {
                top: 48px;
                height: calc(100vh - 48px);
            }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading your experience...</div>
    </div>

    <div class="toggle-bar" id="toggleBar">
        <div class="left-section">

        </div>
        <div class="right-section">
            <span class="version-label active" id="labelMin">Minimal</span>
            <div class="switch" id="switchBtn">
                <div class="dot" id="dot"></div>
            </div>
            <span class="version-label" id="labelArt">Artistic</span>
            <span class="badge">✦ Toggle</span>
        </div>
    </div>

    <div class="iframe-wrap">
        <iframe id="frame" src=""></iframe>
    </div>

    <script>

            },

                artistic: 'https://management-and-finance.vercel.app/'
            },
            'backend-premium': {

                tag: 'Backend Hub',
                minimal: 'https://your-link-here.com/',
                artistic: 'https://your-link-here.com/'
            },
            'contact-form': {
                name: 'Contact Form',
                tag: 'Form',
                minimal: 'https://lead-form-5.vercel.app/',
                artistic: 'https://lead-form-5.vercel.app/'
            }

        // ============================================
        // PRODUCTS THAT HAVE BOTH MINIMAL & ARTISTIC
        // ============================================
        const productsWithToggle = [
            'landing-page-main',
            'brochure-site-main',
            'blog-platform-main',
            'ecommerce-store-main'
        ];

        // ============================================
        // GET URL PARAMETERS
        // ============================================
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        // ============================================
        // TOGGLE FUNCTION
        // ============================================
        let isArtistic = false;
        let currentProductId = null;

        function toggleVersion() {
            isArtistic = !isArtistic;
            if (isArtistic) {
                switchTo('artistic');
            } else {
                switchTo('minimal');
            }
        }

        function switchTo(version) {
            const frame = document.getElementById('frame');
            const switchBtn = document.getElementById('switchBtn');
            const labelMin = document.getElementById('labelMin');
            const labelArt = document.getElementById('labelArt');
            const styleName = document.getElementById('styleName');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            if (!currentProductId || !products[currentProductId]) {
                frame.src = 'about:blank';
                loadingOverlay.classList.add('hidden');
                console.error('Product not found:', currentProductId);
                return;
            }

            const product = products[currentProductId];
            loadingOverlay.classList.remove('hidden');
            
            if (version === 'artistic') {
                frame.src = product.artistic;
                switchBtn.classList.add('active');
                labelMin.classList.remove('active');
                labelArt.classList.add('active');
                styleName.textContent = 'Artistic';
                styleName.classList.add('active');
                isArtistic = true;
            } else {
                frame.src = product.minimal;
                switchBtn.classList.remove('active');
                labelMin.classList.add('active');
                labelArt.classList.remove('active');
                styleName.textContent = 'Minimal';
                styleName.classList.add('active');
                isArtistic = false;
            }

            frame.onload = function() {
                loadingOverlay.classList.add('hidden');
            };
            
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 2000);
        }

        // ============================================
        // LOAD ON START
        // ============================================
        function loadContent() {
            const productId = getParam('product');
            const version = getParam('version') || 'minimal';
            const toggleBar = document.getElementById('toggleBar');
            
            console.log('Loading product:', productId, 'version:', version);
            
            if (productId && products[productId]) {
                currentProductId = productId;
                
                // SHOW/HIDE TOGGLE + COLLAPSE/EXPAND IFRAME SPACE
                if (productsWithToggle.includes(productId)) {
                    toggleBar.classList.add('show');
                    document.body.classList.remove('no-toggle');
                } else {
                    toggleBar.classList.remove('show');
                    document.body.classList.add('no-toggle');
                }
                
                switchTo(version);
            } else {
                document.getElementById('frame').src = 'about:blank';
                document.getElementById('loadingOverlay').classList.add('hidden');
                toggleBar.classList.remove('show');
                document.body.classList.add('no-toggle');
                console.error('No product found for ID:', productId);
                alert('No product found! Please check the product ID.');
            }
        }

        // ============================================
        // SETUP EVENT LISTENERS
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadContent();

            const switchBtn = document.getElementById('switchBtn');
            const labelMin = document.getElementById('labelMin');
            const labelArt = document.getElementById('labelArt');

            switchBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const productId = getParam('product');
                if (productId && productsWithToggle.includes(productId)) {
                    toggleVersion();
                }
            });

            labelMin.addEventListener('click', function() {
                const productId = getParam('product');
                if (productId && productsWithToggle.includes(productId)) {
                    switchTo('minimal');
                }
            });

            labelArt.addEventListener('click', function() {
                const productId = getParam('product');
                if (productId && productsWithToggle.includes(productId)) {
                    switchTo('artistic');
                }
            });

            console.log('Toggle controls ready!');
        });
    </script>
